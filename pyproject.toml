[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nagoyaction"
version = "0.1.0"
description = "Local pipeline execution and forge management"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
nagoyaction = "nagoyaction:main"
local-forge = "local_forge:main"

[tool.setuptools]
py-modules = ["nagoyaction", "local_forge"]
